name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Подписать IPA и загрузить его в TestFlight"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/scripts/validate_testflight_config.py"
      - ".github/workflows/mobile-ios-device.yml"
      - "docs/ios-testflight.md"
      - "global.json"
      - "Directory.Build.props"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Domain/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Mobile/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/validate_testflight_config.py"
      - ".github/workflows/mobile-ios-device.yml"
      - "docs/ios-testflight.md"
      - "global.json"
      - "Directory.Build.props"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Domain/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Mobile/**"

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: TestFlight configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public iOS configuration
        run: >-
          python3
          .github/scripts/validate_testflight_config.py
          --project src/UniversitySchedule.Mobile/UniversitySchedule.Mobile.csproj
          --info-plist src/UniversitySchedule.Mobile/Platforms/iOS/Info.plist
          --privacy-manifest src/UniversitySchedule.Mobile/Platforms/iOS/Resources/PrivacyInfo.xcprivacy
          --expected-bundle-id io.github.l0naroff313.cfuschedule

      - name: Explain dry run
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight != true }}
        shell: bash
        run: |
          {
            echo '### TestFlight preflight passed'
            echo
            echo 'Public iOS metadata is valid. No Apple certificate, provisioning profile, API key, or paid membership was used.'
            echo
            echo 'The separate iOS workflow builds and launches the same source in iPhone Simulator.'
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Sign and upload TestFlight IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight == true }}
    needs: preflight
    runs-on: macos-26
    env:
      BUNDLE_ID: io.github.l0naroff313.cfuschedule
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      API_BASE_URL: ${{ vars.UNIVERSITY_SCHEDULE_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify protected secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$BUILD_CERTIFICATE_BASE64" ]] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_BASE64)
          [[ -n "$P12_PASSWORD" ]] || missing+=(IOS_DISTRIBUTION_CERTIFICATE_PASSWORD)
          [[ -n "$BUILD_PROVISION_PROFILE_BASE64" ]] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [[ -n "$ASC_API_KEY_ID" ]] || missing+=(APP_STORE_CONNECT_API_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -n "$ASC_API_PRIVATE_KEY_BASE64" ]] || missing+=(APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            echo 'Run the workflow with upload_to_testflight=false until Apple Developer is active.' >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install the .NET MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Install Apple signing materials
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-app-store.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/ios-app-store-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          ASC_PRIVATE_KEYS_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          ASC_PRIVATE_KEY_PATH="$ASC_PRIVATE_KEYS_DIRECTORY/AuthKey_${ASC_API_KEY_ID}.p8"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$ASC_PRIVATE_KEYS_DIRECTORY"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 --decode > "$ASC_PRIVATE_KEY_PATH"
          chmod 600 "$ASC_PRIVATE_KEY_PATH"

          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$ASC_PRIVATE_KEY_PATH"; then
            echo 'APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 does not decode to an App Store Connect .p8 key.' >&2
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST_PATH")
          CODESIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Apple Distribution:.*\)"/\1/p' \
            | head -n 1)

          if [[ -z "$PROFILE_UUID" || -z "$CODESIGN_IDENTITY" ]]; then
            echo 'The certificate or provisioning profile does not contain an Apple Distribution identity.' >&2
            exit 1
          fi
          if [[ "$PROFILE_APP_ID" != *".$BUNDLE_ID" ]]; then
            echo "The provisioning profile is not valid for bundle id $BUNDLE_ID." >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST_PATH" >/dev/null 2>&1; then
            echo 'The provisioning profile is Ad Hoc or Development. TestFlight requires an App Store Connect profile.' >&2
            exit 1
          fi
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST_PATH" 2>/dev/null || true)" == 'true' ]]; then
            echo 'The provisioning profile enables debugging and cannot be used for TestFlight.' >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "IOS_CODESIGN_KEY=$CODESIGN_IDENTITY"
            echo "IOS_PROVISIONING_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Restore iPhone device dependencies
        run: >-
          dotnet restore
          src/UniversitySchedule.Mobile/UniversitySchedule.Mobile.csproj
          -p:RuntimeIdentifier=ios-arm64

      - name: Publish App Store IPA
        run: >-
          dotnet publish
          src/UniversitySchedule.Mobile/UniversitySchedule.Mobile.csproj
          --configuration Release
          --framework net10.0-ios
          --no-restore
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:BuildIpa=true
          -p:ApplicationVersion=${{ github.run_number }}
          -p:UniversityScheduleApiBaseUrl="$API_BASE_URL"
          -p:CodesignKey="$IOS_CODESIGN_KEY"
          -p:CodesignProvision="$IOS_PROVISIONING_UUID"
          -p:ValidateXcodeVersion=false
          -warnaserror

      - name: Verify signed IPA metadata
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH=$(find src/UniversitySchedule.Mobile/bin/Release/net10.0-ios/ios-arm64/publish -name '*.ipa' -type f -print -quit)
          if [[ -z "$IPA_PATH" ]]; then
            echo 'The signed IPA was not produced.' >&2
            exit 1
          fi

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH=$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
          APP_INFO_PLIST="$APP_PATH/Info.plist"
          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO_PLIST")
          ACTUAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO_PLIST")

          [[ "$ACTUAL_BUNDLE_ID" == "$BUNDLE_ID" ]] || {
            echo "Unexpected IPA bundle id: $ACTUAL_BUNDLE_ID" >&2
            exit 1
          }
          [[ "$ACTUAL_BUILD_NUMBER" == "${{ github.run_number }}" ]] || {
            echo "Unexpected IPA build number: $ACTUAL_BUILD_NUMBER" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Keep signed IPA as a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFU-ElJournal-TestFlight-${{ github.run_number }}
          path: src/UniversitySchedule.Mobile/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Validate with App Store Connect
        run: >-
          xcrun altool
          --validate-app
          --file "$IPA_PATH"
          --type ios
          --apiKey "$ASC_API_KEY_ID"
          --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: >-
          xcrun altool
          --upload-app
          --file "$IPA_PATH"
          --type ios
          --apiKey "$ASC_API_KEY_ID"
          --apiIssuer "$ASC_ISSUER_ID"

      - name: Write upload summary
        shell: bash
        run: |
          {
            echo '### TestFlight upload accepted'
            echo
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Build: \`${{ github.run_number }}\`"
            echo "- Provisioning profile: \`$IOS_PROFILE_NAME\`"
            if [[ -z "$API_BASE_URL" ]]; then
              echo '- API URL: not configured; server synchronization is disabled in this build.'
            else
              echo '- API URL: configured through the protected repository variable.'
            fi
            echo
            echo 'Apple still needs to process the uploaded build before it appears in TestFlight.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/ios-distribution-certificate.p12"
          rm -f "$RUNNER_TEMP/ios-app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/ios-app-store-profile.plist"
          if [[ -n "${ASC_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          fi
