name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Server and core tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run test projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dotnet test "$project" --configuration Release
          done < <(find tests -name '*.csproj' -type f | sort)
