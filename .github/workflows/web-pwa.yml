name: PWA

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/web-pwa.yml"
      - "src/UniversitySchedule.Web/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Mobile/Resources/Raw/cfu-reference-catalog.json"
      - "tests/UniversitySchedule.Mobile.Core.Tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/web-pwa.yml"
      - "src/UniversitySchedule.Web/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Mobile/Resources/Raw/cfu-reference-catalog.json"
      - "tests/UniversitySchedule.Mobile.Core.Tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test shared mobile core
        run: dotnet test tests/UniversitySchedule.Mobile.Core.Tests/UniversitySchedule.Mobile.Core.Tests.csproj --configuration Release

      - name: Publish PWA
        run: dotnet publish src/UniversitySchedule.Web/UniversitySchedule.Web.csproj --configuration Release --output artifacts/pwa

      - name: Prepare root-hosted PWA artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cp artifacts/pwa/wwwroot/index.html artifacts/pwa/wwwroot/404.html
          cp -R artifacts/pwa/wwwroot artifacts/pwa-root

      - name: Prepare GitHub Pages base path
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          sed -i 's#<base href="/" />#<base href="/cfu-schedule-app/" />#' artifacts/pwa/wwwroot/index.html
          cp artifacts/pwa/wwwroot/index.html artifacts/pwa/wwwroot/404.html
          touch artifacts/pwa/wwwroot/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFU-ElJournal-PWA
          path: ${{ github.event_name == 'pull_request' && 'artifacts/pwa/wwwroot' || 'artifacts/pwa-root' }}
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pwa/wwwroot

  deploy:
    name: Deploy PWA
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-yandex:
    name: Deploy PWA to Yandex Cloud
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.YANDEX_STORAGE_BUCKET != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: yandex-cloud
      url: ${{ vars.PWA_PUBLIC_URL }}

    steps:
      - name: Download root-hosted PWA
        uses: actions/download-artifact@v4
        with:
          name: CFU-ElJournal-PWA
          path: site

      - name: Validate Yandex Cloud credentials
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Add YANDEX_ACCESS_KEY_ID and YANDEX_SECRET_ACCESS_KEY to GitHub Actions secrets."
            exit 1
          fi

      - name: Upload versioned PWA assets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          YANDEX_STORAGE_BUCKET: ${{ vars.YANDEX_STORAGE_BUCKET }}
        run: >-
          aws --endpoint-url=https://storage.yandexcloud.net
          s3 sync site "s3://$YANDEX_STORAGE_BUCKET"
          --delete
          --no-progress
          --cache-control "public,max-age=31536000,immutable"
          --exclude "index.html"
          --exclude "404.html"
          --exclude "manifest.webmanifest"
          --exclude "service-worker.js"
          --exclude "service-worker.published.js"
          --exclude "service-worker-assets.js"

      - name: Upload PWA entry points without persistent caching
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          YANDEX_STORAGE_BUCKET: ${{ vars.YANDEX_STORAGE_BUCKET }}
        run: |
          for file in index.html 404.html manifest.webmanifest service-worker.js service-worker.published.js service-worker-assets.js; do
            if [[ -f "site/$file" ]]; then
              aws --endpoint-url=https://storage.yandexcloud.net \
                s3 cp "site/$file" "s3://$YANDEX_STORAGE_BUCKET/$file" \
                --no-progress \
                --cache-control "no-cache, no-store, must-revalidate"
            fi
          done
