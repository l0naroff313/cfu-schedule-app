name: PWA

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/web-pwa.yml"
      - "src/UniversitySchedule.Web/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Mobile/Resources/Raw/cfu-reference-catalog.json"
      - "tests/UniversitySchedule.Mobile.Core.Tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/web-pwa.yml"
      - "src/UniversitySchedule.Web/**"
      - "src/UniversitySchedule.Mobile.Core/**"
      - "src/UniversitySchedule.Contracts/**"
      - "src/UniversitySchedule.Mobile/Resources/Raw/cfu-reference-catalog.json"
      - "tests/UniversitySchedule.Mobile.Core.Tests/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test shared mobile core
        run: dotnet test tests/UniversitySchedule.Mobile.Core.Tests/UniversitySchedule.Mobile.Core.Tests.csproj --configuration Release

      - name: Publish PWA
        run: dotnet publish src/UniversitySchedule.Web/UniversitySchedule.Web.csproj --configuration Release --output artifacts/pwa

      - name: Prepare root-hosted PWA artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -f artifacts/pwa/wwwroot/404.html
          cp -R artifacts/pwa/wwwroot artifacts/pwa-root

      - name: Prepare GitHub Pages base path
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          sed -i 's#<base href="/" />#<base href="/cfu-schedule-app/" />#' artifacts/pwa/wwwroot/index.html
          cp artifacts/pwa/wwwroot/index.html artifacts/pwa/wwwroot/404.html
          touch artifacts/pwa/wwwroot/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFU-ElJournal-PWA
          path: ${{ github.event_name == 'pull_request' && 'artifacts/pwa/wwwroot' || 'artifacts/pwa-root' }}
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pwa/wwwroot

  deploy:
    name: Deploy PWA
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy PWA to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}

    steps:
      - name: Download root-hosted PWA
        uses: actions/download-artifact@v4
        with:
          name: CFU-ElJournal-PWA
          path: site

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions repository variables."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to GitHub Actions repository secrets."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add public PWA address to the run summary
        shell: bash
        env:
          PWA_URL: ${{ steps.cloudflare.outputs.pages-deployment-alias-url }}
        run: |
          echo "### Cloudflare PWA" >> "$GITHUB_STEP_SUMMARY"
          echo "[$PWA_URL]($PWA_URL)" >> "$GITHUB_STEP_SUMMARY"
